name: AWS DevOps CI/CD

on:
  push:
    branches: [ master ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::875115941626:role/GitHubActions-ECR-Role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t aws-devops-app .
          docker tag aws-devops-app:latest 875115941626.dkr.ecr.eu-north-1.amazonaws.com/aws-devops-app:latest

      - name: Push Docker image to ECR
        run: |
          docker push 875115941626.dkr.ecr.eu-north-1.amazonaws.com/aws-devops-app:latest
